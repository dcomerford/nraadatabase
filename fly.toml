app = "mcsi-survey"
primary_region = "syd"

[build]

[env]
  FLASK_ENV = "production"
  PORT = "8080"
  SURVEY_ONLY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
